
name: Build Vitrine IPA

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag de la release contenant Spotify"
        required: true
        type: string
        default: "spotify-source"
      ipa_filename:
        description: "Nom exact du fichier IPA"
        required: true
        type: string
        default: "Spotify-2-IPAOMTK.COM.ipa"

permissions:
  contents: read

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/checkout@v5
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Install tools
        run: |
          brew install make dpkg ldid
          python3 -m pip install --break-system-packages git+https://github.com/asdfzxcvbn/pyzule-rw.git

      - name: Download private IPA
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          IPA_FILENAME: ${{ inputs.ipa_filename }}
        run: |
          mkdir -p ipa
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$IPA_FILENAME" \
            --dir ipa
          mv "ipa/$IPA_FILENAME" ipa/spotify.ipa
          file ipa/spotify.ipa

      - run: make release

      - uses: actions/upload-artifact@v5
        with:
          name: vitrine.ipa
          path: out/*.ipa
          if-no-files-found: error
